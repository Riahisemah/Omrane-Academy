# Netlify configuration — https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Each page has its own pre-built HTML file, served as-is: /programmes → programmes.html,
# /ar/programmes → ar/programmes.html (Netlify "pretty URLs", no redirect).
# "/ar" is both a page (ar.html) and a folder, so it is mapped explicitly; without
# this rule Netlify answers 301 → /ar/.
[[redirects]]
  from = "/ar"
  to = "/ar.html"
  status = 200
  force = true

[[redirects]]
  from = "/ar/"
  to = "/ar.html"
  status = 200
  force = true

# Unknown URLs: the app takes over (Arabic shell under /ar, French elsewhere).
[[redirects]]
  from = "/ar/*"
  to = "/ar.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Vite assets have a content hash in their name: cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and icons keep a stable name: cache for 30 days, then revalidate in the background.
# (Replace a photo under a new file name if it must change immediately.)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Netlify serves .webmanifest as octet-stream by default; browsers expect this type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
