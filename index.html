<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#142B4A" />
    <meta name="color-scheme" content="only light" />
    <title>Omrane Academy — Soutien scolaire et informatique à El Omrane Supérieur, Tunis</title>
    <meta
      name="description"
      content="Omrane Academy, projet de centre éducatif à El Omrane Supérieur (Tunis) : soutien scolaire pour le primaire, le collège et le lycée, et initiation à l’informatique."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Omrane Academy" />
    <meta property="og:title" content="Omrane Academy — Le chemin vers la réussite" />
    <meta
      property="og:description"
      content="Soutien scolaire du primaire au lycée et initiation à l’informatique, à El Omrane Supérieur, Tunis."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Structured data: only verified information (name, area, WhatsApp number, Facebook page). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Omrane Academy",
        "slogan": "Le chemin vers la réussite",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/images/og-image.jpg",
        "telephone": "+216 26 653 690",
        "sameAs": ["https://www.facebook.com/profile.php?id=61595131151964"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "El Omrane Supérieur",
          "addressRegion": "Tunis",
          "addressCountry": "TN"
        },
        "areaServed": "El Omrane Supérieur, Tunis",
        "knowsLanguage": ["fr", "ar"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: static copy of the contact form so Netlify detects it at deploy time.
         Field names must match the payload sent by src/components/ContactForm.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="nom" /><input name="telephone" /><input name="email" />
      <input name="niveau" /><input name="service" /><textarea name="message"></textarea>
      <input name="website" />
    </form>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">
        Omrane Academy — soutien scolaire et initiation à l’informatique à El Omrane Supérieur, Tunis.
        Activez JavaScript pour afficher le site.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
